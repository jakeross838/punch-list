<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2830">
<title><!--TITLE--> · Punch List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--deep:#1A2830;--tile:#3B5864;--gulf:#436A7A;--sand:#F7F5EC;--quiet:#56707B;--line:rgba(59,88,100,.15)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--tile);font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.bar{position:sticky;top:0;display:flex;align-items:baseline;gap:10px;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));background:var(--deep);color:var(--sand)}
.brand{font:600 13px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--sand);text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:22px 18px calc(60px + env(safe-area-inset-bottom))}
.eyebrow{font:500 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--quiet)}
h1{margin:8px 0 18px;font:600 32px/1.1 "Space Grotesk",Inter,sans-serif;color:var(--tile)}
h2{margin:30px 0 8px;font:600 19px/1.25 "Space Grotesk",Inter,sans-serif;color:var(--deep)}
p,li{margin:0 0 10px}
ul{padding-left:20px;margin:0 0 10px}
a{color:var(--gulf)}
.lead{font-size:17px}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--quiet)}
.foot a{margin-right:16px}
</style>
</head>
<body>
<div class="bar"><a class="brand" href="/support/">Punch List</a></div>
<main class="wrap">
<!--BODY-->
<p class="foot"><a href="/privacy/">Privacy Policy</a><a href="/terms/">Terms of Use</a><a href="/support/">Support</a></p>
</main>
</body>
</html>
